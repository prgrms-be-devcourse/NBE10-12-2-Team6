name: Deploy Dockerized Spring Boot to Oracle Cloud

on:
  push:
    branches:
      - main
    paths:
      - deploy-version-back.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  IMAGE_NAME: triplog-backend              # 원하는 도커 이미지 이름
  CONTAINER_NAME: spring-backend  # 실행될 컨테이너 이름
  ARTIFACT_NAME: my-app.tar.gz     # 전송할 tar 파일 이름
  TARGET_DIR: /triplog/back  # 서버에서 사용할 디렉토리
  HOST_PORT: 8080                  # 외부에서 접근할 포트
  CONTAINER_PORT: 8080             # 앱이 내부에서 열 포트

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🍏 Checkout Repository
        uses: actions/checkout@v4

      - name: 🍏 Extract version from deploy-version-back.yml
        run: |
          VERSION=$(jq -r .version < deploy-version-back.yml)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: 🍏 Create .env file from Secrets
        run: |
          echo "FILE_UPLOAD_BASE_URL=${{ secrets.FILE_UPLOAD_BASE_URL }}" > .env

      - name: 🍏 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🍏 Build Docker Image
        run: docker build -t $IMAGE_NAME:${{ env.VERSION }} ./back

      - name: 🍏 Save Docker Image as Tarball
        run: docker save $IMAGE_NAME:${{ env.VERSION }} | gzip > $ARTIFACT_NAME

      - name: 🍏 Prepare upload directory
        run: |
          mkdir upload
          cp $ARTIFACT_NAME upload/
          cp .env upload/

      - name: 🍏 Copy to Oracle Cloud
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.HOST }}
          username: ubuntu
          key: ${{ secrets.KEY }}
          source: upload/
          target: ${{ env.TARGET_DIR }}
          strip_components: 1

      - name: 🐳 Deploy on Oracle Cloud VM via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.KEY }}
          script: |
            cd ${{ env.TARGET_DIR }}
            docker load < ${{ env.ARTIFACT_NAME }}
            docker stop ${{ env.CONTAINER_NAME }} || true
            docker rm ${{ env.CONTAINER_NAME }} || true
            docker run -d --name ${{ env.CONTAINER_NAME }} \
              --env-file .env \
              -p ${{ env.HOST_PORT }}:${{ env.CONTAINER_PORT }} \
              ${{ env.IMAGE_NAME }}:${{ env.VERSION }}

      - name: 🍏 Clean up local temp files
        run: rm -rf upload .env $ARTIFACT_NAME