name: Deploy Dockerized Spring Boot to Oracle Cloud

# ────────────────────────────────────────────────────────────
# 트리거 조건
#   - main 브랜치에 deploy-version-back.yml 파일이 변경되어 push될 때 자동 실행
#   - 또는 GitHub Actions UI에서 수동으로 실행 가능 (workflow_dispatch)
# ────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main
    paths:
      - deploy-version-back.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# ────────────────────────────────────────────────────────────
# 워크플로우 전체에서 공통으로 사용하는 환경변수
# ────────────────────────────────────────────────────────────
env:
  IMAGE_NAME: triplog-backend       # Docker 이미지 이름
  CONTAINER_NAME: spring-backend    # 서버에서 실행될 컨테이너 이름
  ARTIFACT_NAME: my-app.tar.gz      # 서버로 전송할 이미지 압축 파일명
  TARGET_DIR: /home/ubuntu/triplog/back   # 서버에서 파일을 저장할 디렉토리
  HOST_PORT: 8080                   # 서버 포트 (Nginx가 localhost:8080으로 프록시)
  CONTAINER_PORT: 8080              # Spring Boot 앱이 내부에서 사용하는 포트

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # [1] GitHub 레포지토리 코드를 Actions Runner(빌드 서버)에 내려받기
      - name: 🍏 Checkout Repository
        uses: actions/checkout@v4

      # [2] deploy-version-back.yml에서 version 값을 읽어 이미지 태그로 사용
      #     예: "1.0.0" → 이미지명 triplog-backend:1.0.0
      - name: 🍏 Extract version from deploy-version-back.yml
        run: |
          VERSION=$(jq -r .version < deploy-version-back.yml)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # [3] GitHub Secrets에 등록된 값으로 .env 파일 생성
      #     이 파일은 Docker 컨테이너 실행 시 환경변수로 주입됨
      - name: 🍏 Create .env file from Secrets
        run: |
          echo "FILE_UPLOAD_BASE_URL=${{ secrets.FILE_UPLOAD_BASE_URL }}" > .env

      # [4] arm64 크로스 플랫폼 빌드를 위한 QEMU 에뮬레이터 설치
      #     GitHub Actions 서버(amd64)에서 Oracle Cloud 서버(arm64)용 이미지를 빌드하기 위해 필요
      - name: 🍏 Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      # [5] 멀티 플랫폼 Docker 이미지 빌드를 위한 Buildx 설정
      - name: 🍏 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # [6] back/Dockerfile을 기준으로 Docker 이미지 빌드
      #     --platform linux/arm64: Oracle Cloud 서버(arm64)에 맞게 빌드
      #     --load: 빌드한 이미지를 로컬 Docker daemon에 저장 (docker save 사용을 위해 필요)
      - name: 🍏 Build Docker Image
        run: docker buildx build --platform linux/arm64 --load -t $IMAGE_NAME:${{ env.VERSION }} ./back

      # [7] 빌드된 이미지를 .tar.gz 압축 파일로 저장
      #     (서버에 Docker Hub 없이 직접 전송하기 위한 방식)
      - name: 🍏 Save Docker Image as Tarball
        run: docker save $IMAGE_NAME:${{ env.VERSION }} | gzip > $ARTIFACT_NAME

      # [8] SCP로 전송할 파일들을 upload/ 폴더에 모으기
      #     - 이미지 tarball
      #     - .env 파일
      - name: 🍏 Prepare upload directory
        run: |
          mkdir upload
          cp $ARTIFACT_NAME upload/
          cp .env upload/

      # [9] SCP를 이용해 upload/ 폴더 내 파일들을 Oracle Cloud 서버로 전송
      #     target 경로: /home/ubuntu/triplog/back/
      - name: 🍏 Copy to Oracle Cloud
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.HOST }}
          username: ubuntu
          key: ${{ secrets.KEY }}
          source: upload/
          target: ${{ env.TARGET_DIR }}
          strip_components: 1

      # [10] SSH로 Oracle Cloud 서버에 접속하여 Docker 컨테이너 교체 배포
      #      - docker load: 전송받은 이미지 tarball을 Docker에 등록
      #      - docker stop/rm: 기존 컨테이너 종료 및 삭제 (없어도 에러 무시)
      #      - docker run: 새 이미지로 컨테이너 실행
      #        --restart unless-stopped: 서버 재부팅 시 컨테이너 자동 재시작
      #      - docker image prune: 사용하지 않는 구버전 이미지 삭제 (디스크 절약)
      - name: 🐳 Deploy on Oracle Cloud VM via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.KEY }}
          script: |
            cd ${{ env.TARGET_DIR }}
            docker load < ${{ env.ARTIFACT_NAME }}
            docker stop ${{ env.CONTAINER_NAME }} || true
            docker rm ${{ env.CONTAINER_NAME }} || true
            docker run -d \
              --name ${{ env.CONTAINER_NAME }} \
              --restart unless-stopped \
              --env-file .env \
              -p ${{ env.HOST_PORT }}:${{ env.CONTAINER_PORT }} \
              ${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            docker image prune -f

      # [11] Actions Runner에 남아있는 임시 파일 삭제 (보안 및 용량 정리)
      - name: 🍏 Clean up local temp files
        run: rm -rf upload .env $ARTIFACT_NAME