spring:
  datasource:
    url: jdbc:mysql://mysql:3306/triplog?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: triplog
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      initialization-fail-timeout: -1  # DB 준비될 때까지 무한 재시도
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
logging:
  level:
    com.back: INFO
management:
  endpoints:
    web:
      exposure:
        include: prometheus # 프로메테우스 수집 경로 활성화
  metrics:
    tags:
      application: triplog # 그라파나에서 여러 프로젝트를 구분하기 위한 이름표
