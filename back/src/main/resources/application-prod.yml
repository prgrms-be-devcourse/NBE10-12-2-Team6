spring:
  datasource:
    url: jdbc:mysql://mysql:3306/triplog?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: triplog
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      initialization-fail-timeout: -1  # DB 준비될 때까지 무한 재시도
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
logging:
  level:
    com.back: INFO
