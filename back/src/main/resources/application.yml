spring:
  application:
    name: back
  profiles:
    active: dev
#  output:
#    ansi:
#      enabled: always
  datasource:
    hikari:
      auto-commit: false
  jpa:
    hibernate:
      ddl-auto: update
springdoc:
  default-produces-media-type: application/json;charset=UTF-8
logging:
  level:
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.orm.jdbc.extract: TRACE
    org.springframework.transaction.interceptor: TRACE
jwt:
  secret: "this-is-a-very-long-secret-key-for-jwt-signing-minimum-256-bits" # 256비트 이상이어야 HS256 서명 가능
  access-expiration: 1800000   # 30분 (ms)
  refresh-expiration: 604800000 # 7일 (ms)
